<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Jogo de Adivinhação</h1>
    <p>Escolhi um número inteiro entre 1 e 100. Você tem 10 tentativas para descobrir qual é!</p>

    <form id="formulario" novalidate>
      <label for="palpite">Seu palpite</label>
      <input type="number" id="palpite" min="1" max="100" step="1" required placeholder="De 1 a 100">
      <button type="submit" id="chutar">Chutar</button>
    </form>

    <p id="mensagem" role="status">Digite um número para começar.</p>
    <p id="tentativas">Tentativas restantes: 10</p>
    <button type="button" id="reiniciar" hidden>Jogar novamente</button>
  </main>
</body>
</html>
